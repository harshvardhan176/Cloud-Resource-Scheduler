server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;

  location = /healthz { return 200 "ok"; add_header Content-Type text/plain; }

  location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Dashboard aggregator endpoints (read-only, public)
  location /api/ {
    proxy_pass http://dashboard-backend-service:8008;
    proxy_set_header Host $host;
  }

  # Auth + ML + RL + Exec endpoints go through the gateway
  location ~ ^/(auth|ml|rl|exec|observe)/ {
    proxy_pass http://api-gateway:8000;
    proxy_set_header Host $host;
  }

  # WebSocket
  location /ws/ {
    proxy_pass http://dashboard-backend-service:8008;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 600s;
  }

  location / { try_files $uri $uri/ /index.html; }
}
