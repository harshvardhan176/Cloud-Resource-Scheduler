apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudbrain-ingress
  namespace: cloudbrain
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: "/healthz"
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: dashboard-backend-service, port: { number: 8008 } }
          - path: /ws
            pathType: Prefix
            backend:
              service: { name: dashboard-backend-service, port: { number: 8008 } }
          - path: /auth
            pathType: Prefix
            backend:
              service: { name: api-gateway, port: { number: 8000 } }
          - path: /ml
            pathType: Prefix
            backend:
              service: { name: api-gateway, port: { number: 8000 } }
          - path: /rl
            pathType: Prefix
            backend:
              service: { name: api-gateway, port: { number: 8000 } }
          - path: /exec
            pathType: Prefix
            backend:
              service: { name: api-gateway, port: { number: 8000 } }
          - path: /observe
            pathType: Prefix
            backend:
              service: { name: api-gateway, port: { number: 8000 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 80 } }
