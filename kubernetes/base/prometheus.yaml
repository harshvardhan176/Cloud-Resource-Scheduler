# ─────────────────────────────────────────────────────────────
#  Prometheus — in-cluster metrics scraper
#  Scrapes every microservice's /metrics endpoint every 15 s
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: cloudbrain
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: cloudbrain

    scrape_configs:
      - job_name: cloudbrain-services
        metrics_path: /metrics
        static_configs:
          - targets:
              - api-gateway:8000
              - auth-service:8001
              - ml-prediction-service:8003
              - rl-scheduler-service:8004
              - executor-service:8005
              - observability-service:8007
              - dashboard-backend-service:8008
            labels:
              tier: backend

      # cAdvisor metrics for container CPU/memory
      - job_name: kubernetes-cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
---
# Prometheus needs read access to nodes + pods for service discovery
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: cloudbrain
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloudbrain-prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "nodes/metrics", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloudbrain-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloudbrain-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: cloudbrain
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: cloudbrain
  labels: { app: prometheus }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=24h
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "768Mi" }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: cloudbrain
spec:
  selector: { app: prometheus }
  ports:
    - port: 9090
      targetPort: 9090
