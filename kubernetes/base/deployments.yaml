apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: cloudbrain, labels: { app: frontend } }
spec:
  replicas: 2
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: REGISTRY/cloudbrain/frontend:1.0.0
          ports: [{ containerPort: 80 }]
          livenessProbe:  { httpGet: { path: /healthz, port: 80 }, initialDelaySeconds: 10 }
          readinessProbe: { httpGet: { path: /healthz, port: 80 }, initialDelaySeconds: 3 }
          resources:
            requests: { cpu: "50m",  memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
