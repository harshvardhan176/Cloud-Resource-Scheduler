# ─────────────────────────────────────────────────────────────
#  CloudBrain · Deployments (7 microservices + frontend)
# ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata: { name: api-gateway, namespace: cloudbrain, labels: { app: api-gateway } }
spec:
  replicas: 2
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata:
      labels: { app: api-gateway }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: api-gateway
          image: REGISTRY/cloudbrain/api-gateway:1.0.0
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: cloudbrain-config }
            - secretRef:    { name: cloudbrain-secrets }
          livenessProbe:  { httpGet: { path: /healthz, port: 8000 }, initialDelaySeconds: 15 }
          readinessProbe: { httpGet: { path: /healthz, port: 8000 }, initialDelaySeconds: 5 }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
---
