# docker-compose.yml
# ------------------
# Local development setup for the Intelligent Cloud Resource Scheduler.
# This configuration runs in MOCK_MODE, allowing it to function without AWS credentials.

version: "3.9"

services:
  workload:
    build: ./workload-service
    ports:
      - "5000:5000"
    environment:
      - HOSTNAME=workload-local
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  forecast-client:
    build: ./forecast-client
    ports:
      - "5001:5001"
    environment:
      - MOCK_MODE=true
      - AWS_REGION=ap-south-1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  rl-decision:
    build: ./rl-decision-service
    ports:
      - "5002:5002"
    environment:
      - MOCK_MODE=true
      - MIN_PODS=1
      - MAX_PODS=10
      - LOCAL_MODEL_PATH=/app/rl-policy.zip
    volumes:
      # We'll expect the model to be generated and placed here if desired
      - ./rl-policy.zip:/app/rl-policy.zip:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  metrics-collector:
    build: ./metrics-collector
    environment:
      - MOCK_MODE=true
      - STATIC_WORKLOAD_ENDPOINTS=workload:5000
      - COLLECTION_INTERVAL_SECONDS=10
    depends_on:
      - workload

  orchestrator:
    build: ./workload-service # Re-using workload image for basic python environment
    command: python /app/orchestrator.py
    environment:
      - FORECAST_URL=http://forecast-client:5001/forecast
      - DECISION_URL=http://rl-decision:5002/decide
      - WORKLOAD_METRICS_URL=http://workload:5000/metrics
    volumes:
      - ./orchestrator.py:/app/orchestrator.py:ro
    depends_on:
      - forecast-client
      - rl-decision
      - workload
